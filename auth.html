<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Microsoft To Do access test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Microsoft To Do access test</h1>
    <p>This read-only test signs in to the registered BRS Gage application and asks Microsoft Graph for your To Do lists. It does not create, edit, or delete tasks.</p>
    <button id="testButton" class="button">Sign in and test access</button>
    <button id="signOutButton" class="secondary" hidden>Clear local sign-in</button>
    <pre id="status" aria-live="polite">Ready.</pre>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
